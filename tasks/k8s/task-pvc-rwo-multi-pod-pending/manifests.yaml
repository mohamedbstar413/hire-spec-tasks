apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-storage-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tmp/shared-app-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-app-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shared-app
  template:
    metadata:
      labels:
        app: shared-app
    spec:
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: app-data-pvc
      containers:
      - name: app-container
        image: nginx:1.25-alpine
        volumeMounts:
        - name: data-volume
          mountPath: /usr/share/nginx/html
        ports:
        - containerPort: 80
