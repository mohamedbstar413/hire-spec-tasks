apiVersion: v1
kind: Namespace
metadata:
  name: ns-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-service
  namespace: ns-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-service
  template:
    metadata:
      labels:
        app: app-service
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Namespace
metadata:
  name: ns-b
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: ns-b
spec:
  limits:
  - defaultRequest:
      cpu: "1000m"
      memory: "1Gi"
    default:
      cpu: "2000m"
      memory: "2Gi"
    type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ns-quota
  namespace: ns-b
spec:
  hard:
    requests.cpu: "1200m"
    requests.memory: "1500Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: existing-worker
  namespace: ns-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: nginx:1.25-alpine
        resources:
          requests:
            cpu: "800m"
            memory: "800Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-service
  namespace: ns-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-service
  template:
    metadata:
      labels:
        app: app-service
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
