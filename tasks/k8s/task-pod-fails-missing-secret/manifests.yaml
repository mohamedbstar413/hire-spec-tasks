apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: default
type: Opaque
stringData:
  username: "admin_user"
  password: "SuperSecretPassword123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-backend-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-backend-api
  template:
    metadata:
      labels:
        app: secure-backend-api
    spec:
      containers:
      - name: api-container
        image: python:3.9-slim
        command: ["python3", "-c", "import os, time; print(f'Authenticated DB user: {os.getenv(\"DB_USER\")}'); time.sleep(3600)"]
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        ports:
        - containerPort: 8080
