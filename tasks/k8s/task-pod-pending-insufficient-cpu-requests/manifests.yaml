apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-app
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: compute-app
  template:
    metadata:
      labels:
        app: compute-app
    spec:
      containers:
      - name: worker
        image: python:3.9-slim
        command: ["python3", "-c", "import time; print('Worker running...'); time.sleep(3600)"]
        resources:
          requests:
            cpu: "2000m"
            memory: "128Mi"
          limits:
            cpu: "2000m"
            memory: "256Mi"
