<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quest Complete!</title>
    <style>
        body {
            font-family: -apple-system, Helvetica, Arial, sans-serif;
            background: #1e1e2f;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #2b2b40;
            padding: 2.5rem 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            max-width: 480px;
            text-align: center;
        }
        h1 { color: #ffcc66; margin-top: 0; }
        p.joke { font-size: 1.15rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 You made it!</h1>
        <p class="joke">
            Chuck Norris doesn't read logs. The logs confess to him
            before he even opens the terminal.
        </p>
        <p>Congratulations, you've completed the Linux Quest.</p>
    </div>
</body>
</html>
